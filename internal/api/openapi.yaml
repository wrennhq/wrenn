      description: |
        Admin variant of /v1/capsules/{id}/pty. Same protocol — raw binary
        WebSocket frames for PTY input/output, JSON text frames for
        start/connect/resize/kill control messages, permessage-deflate
        compression, persistent sessions reconnectable via tag.
      responses:
