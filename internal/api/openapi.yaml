      operationId: adminConnectProcess
      tags: [admin]
      security:
        - sessionAuth: []
      responses:
        "101":
          description: WebSocket upgrade
        "404":
          $ref: "#/components/responses/NotFound"

components:
  parameters:
    VolumeRef:
      name: id
      in: path
      required: true
      description: >
        A volume ID (`vol-<base36>`) or name (`vl-cache`). The `vl-` prefix is
        optional on input, so `cache` resolves the same volume as `vl-cache`.
        The two namespaces cannot collide — IDs always start with `vol-`.
      schema:
        type: string
        example: vl-cache

  responses:
    BadRequest:
      description: Invalid request parameters
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"

    Unauthorized:
      description: Missing or invalid auth
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"

    Forbidden:
      description: Authenticated but not permitted (e.g. non-admin on /v1/admin/*)
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"

    NotFound:
      description: Resource not found
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"

    FailedPrecondition:
      description: Resource state does not allow this operation (e.g. exec on a paused capsule)
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"

    ServiceUnavailable:
      description: Temporarily unavailable — no capacity (capacity_unavailable), host draining (host_draining), or the capsule's host is unreachable (host_unreachable, returned as 502)
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"

  securitySchemes:
    apiKeyAuth:
      type: apiKey
      in: header
      name: X-API-Key
      description: API key for capsule lifecycle operations. Create via POST /v1/api-keys.

    sessionAuth:
      type: apiKey
      in: cookie
      name: wrenn_sid
      description: |
        Opaque session cookie set by POST /v1/auth/login, /v1/auth/activate, or
        the OAuth callback. HttpOnly, Secure, SameSite=Strict. Idle window 6h,
        absolute lifetime 24h. State-changing requests also require an
        X-CSRF-Token header matching the wrenn_csrf cookie (double-submit).
    csrfHeader:
      type: apiKey
      in: header
      name: X-CSRF-Token
      description: |
        Double-submit CSRF token whose value must match the wrenn_csrf cookie.
        Required on all non-GET requests authenticated via session cookie.
        Not required for API key auth.

    hostTokenAuth:
      type: apiKey
      in: header
      name: X-Host-Token
      description: Host JWT returned from POST /v1/hosts/register or POST /v1/hosts/auth/refresh. Valid for 7 days.

  schemas:
    SignupRequest:
      type: object
      required: [email, password, name]
      properties:
        email:
          type: string
          format: email
        password:
          type: string
          minLength: 8
        name:
          type: string
          maxLength: 100

    LoginRequest:
      type: object
      required: [email, password]
      properties:
        email:
          type: string
          format: email
        password:
          type: string

    SignupResponse:
      type: object
      properties:
        message:
          type: string
          description: Confirmation message instructing user to check email

    SessionResponse:
      type: object
      description: |
        Returned by login, activate, and switch-team. The actual auth credential
        is the wrenn_sid cookie set on the response. The body carries identity
        data the SPA needs to bootstrap.
      properties:
        user_id:
          type: string
        team_id:
          type: string
        email:
          type: string
        name:
          type: string
        role:
          type: string
        is_admin:
          type: boolean

    CreateAPIKeyRequest:
      type: object
      properties:
        name:
          type: string
          default: Unnamed API Key

    APIKeyResponse:
      type: object
      properties:
        id:
          type: string
        team_id:
          type: string
        name:
          type: string
        key_prefix:
          type: string
          description: Display prefix (e.g. "wrn_ab12cd34...")
        created_by:
          type: string
          description: ID of the user who created the key
        creator_email:
          type: string
          description: Email of the creating user. Omitted if unavailable.
        created_at:
          type: string
          format: date-time
        last_used:
          type: string
          format: date-time
          nullable: true
        key:
          type: string
          description: Full plaintext key. Only returned on creation, never again.
          nullable: true

    CreateCapsuleRequest:
      type: object
      properties:
        template:
          type: string
          default: minimal-ubuntu
          description: |
            Template reference. Either `<name>` — resolved against your team's
            templates first, then platform templates — or `<team-slug>/<name>`
            to launch another team's public template (or a `wrenn/<name>`
            platform template explicitly).
        vcpus:
          type: integer
          default: 2
        memory_mb:
          type: integer
          default: 2048
        timeout_sec:
          type: integer
          minimum: 0
          default: 0
          description: >
            Auto-pause TTL in seconds. The capsule is automatically paused
            after this duration of inactivity (no exec or ping). 0 means
            no auto-pause. Positive values below 60 are silently clamped
            to 60 (the agent's startup envelope).
        metadata:
          type: object
          additionalProperties: { type: string }
          nullable: true
          description: >
            Optional user-supplied key/value labels attached to the capsule.
            Max 20 keys; keys match [a-zA-Z0-9][a-zA-Z0-9._-]{0,63}; values
            are at most 64 characters. Reserved system keys (kernel_version,
            vmm_version, agent_version, envd_version) are rejected. Metadata is
            set at create-time only.
        volume_ids:
          type: array
          items: { type: string }
          nullable: true
          maxItems: 4
          example: ["vl-cache", "vol-8f3kq2m1p7x0a9b4c6d8e2f5g"]
          description: >
            External storage volumes to attach at boot, each given as a volume
            ID ("vol-...") or a name ("vl-cache"). Each is mounted at
            /mnt/<volume-id> inside the guest. At most 4 per capsule. Volumes
            can only be attached at create time and must be detached and owned
            by your team. If a volume is already pinned to a host, the capsule is
            scheduled onto that host; attaching volumes pinned to different hosts
            fails. Not supported for capsules created from a snapshot template.

    CreateVolumeRequest:
      type: object
      description: >
        Supply the size as either `size` or `size_mb`. `name` is optional.
      properties:
        name:
          type: string
          maxLength: 40
          example: vl-cache
          description: >
            Name for the volume, unique within your team and usable anywhere a
            volume ID is accepted. Lowercase letters, numbers, and dashes only
            (no leading, trailing, or repeated dashes), at most 40 characters
            including the `vl-` prefix. The prefix is added if you omit it, so
            `cache` and `vl-cache` name the same volume. Omit the field entirely
            and the volume is named after its own ID.
        size:
          type: string
          example: 20Gi
          description: >
            Volume size with a G/Gi/M/Mi suffix; a bare number is read as MB.
            Fixed at creation. Takes precedence over `size_mb` if both are set.
        size_mb:
          type: integer
          minimum: 100
          example: 5120
          description: >
            Volume size in MB, as an alternative to `size`. Fixed at creation.
            The backing storage is sparse and grows on use, so the size is a
            ceiling rather than an upfront allocation. The maximum is set per
            deployment via `WRENN_MAX_VOLUME_SIZE` (default 20Gi); requesting
            more returns 400.

    Volume:
      type: object
      required: [id, team_id, name, size_mb, status, mount_path, created_at]
      properties:
        id:
          type: string
          description: Volume ID (e.g. "vol-...").
        team_id:
          type: string
        name:
          type: string
          description: >
            The volume's `vl-`-prefixed name, unique within the team. Accepted
            in place of the ID on any volume route and in `volume_ids`.
          example: vl-cache
        size_mb:
          type: integer
        status:
          type: string
          enum: [detached, attaching, attached, deleting]
          description: >
            `detached` — free to attach or delete. `attaching` — reserved by a
            capsule that is booting. `attached` — in use by a capsule.
            `deleting` — a delete is in flight; transient, and reverts to
            `detached` if the delete fails.
        host_id:
          type: string
          nullable: true
          description: Host the volume is pinned to; null until first attached.
        sandbox_id:
          type: string
          nullable: true
          description: Capsule the volume is currently attached to, if any.
        mount_path:
          type: string
          description: Guest mount path while attached (e.g. "/mnt/vol-...").
        created_at:
          type: string
          format: date-time
        last_attached_at:
          type: string
          format: date-time
          nullable: true

    UsageResponse:
      type: object
      properties:
        from:
          type: string
          format: date
        to:
          type: string
          format: date
        points:
          type: array
          items:
            type: object
            properties:
              date:
                type: string
                format: date
              cpu_minutes:
                type: number
              ram_mb_minutes:
                type: number

    CapsuleStats:
      type: object
      properties:
        range:
          type: string
          enum: [5m, 1h, 6h, 24h, 30d]
        current:
          type: object
          properties:
            running_count:
              type: integer
            vcpus_reserved:
              type: integer
            memory_mb_reserved:
              type: integer
        peaks:
          type: object
          description: Maximum values over the last 30 days.
          properties:
            running_count:
              type: integer
            vcpus:
              type: integer
            memory_mb:
              type: integer
        series:
          type: object
          description: Parallel arrays for chart rendering.
          properties:
            labels:
              type: array
              items:
                type: string
                format: date-time
            running:
              type: array
              items:
                type: integer
            vcpus:
              type: array
              items:
                type: integer
            memory_mb:
              type: array
              items:
                type: integer

    Capsule:
      type: object
      properties:
        id:
          type: string
        status:
          type: string
          enum:
            [
              pending,
              starting,
              running,
              pausing,
              paused,
              snapshotting,
              resuming,
              stopping,
              hibernated,
              stopped,
              missing,
              error,
            ]
        template:
          type: string
        vcpus:
          type: integer
        memory_mb:
          type: integer
        timeout_sec:
          type: integer
        created_at:
          type: string
          format: date-time
        started_at:
          type: string
          format: date-time
          nullable: true
        last_active_at:
          type: string
          format: date-time
          nullable: true
        last_updated:
          type: string
          format: date-time
        metadata:
          type: object
          additionalProperties: { type: string }
          nullable: true
          description: |
            User-supplied key/value labels attached at create-time. Once the
            capsule is running this also carries agent-side system version info
            (kernel_version, vmm_version, agent_version, envd_version); those
            reserved keys are owned by the system and cannot be set by users.
        disk_size_mb:
          type: integer
          description: Maximum disk capacity in MiB.
        disk_used_mb:
          type: integer
          format: int64
          description: Current disk usage in MiB. Only populated on individual capsule GET; omitted in list responses.

    CreateSnapshotRequest:
      type: object
      required: [sandbox_id]
      properties:
        sandbox_id:
          type: string
          description: ID of the running capsule to snapshot.
        name:
          type: string
          description: Name for the snapshot template. Auto-generated if omitted.

    Template:
      type: object
      properties:
        name:
          type: string
        type:
          type: string
          enum: [base, snapshot]
        vcpus:
          type: integer
          nullable: true
        memory_mb:
          type: integer
          nullable: true
        size_bytes:
          type: integer
          format: int64
        created_at:
          type: string
          format: date-time
        platform:
          type: boolean
          description: |
            True when the template is platform-managed (visible to all teams,
            e.g. the built-in `minimal-ubuntu` rootfs). False for team-owned
            snapshot templates.
        protected:
          type: boolean
          description: |
            True for built-in system base templates (minimal-ubuntu,
            minimal-alpine, minimal-arch, minimal-fedora). Protected templates
            cannot be deleted.
        public:
          type: boolean
          description: |
            True when the template is published, making it launchable by other
            teams as `<team_slug>/<name>`.
        owned:
          type: boolean
          description: |
            True when the template belongs to your team. A globe indicator is
            shown on your own `public` templates.
        team_slug:
          type: string
          description: |
            Slug of the owning team. For foreign public templates, reference the
            template as `<team_slug>/<name>` when creating a capsule.
        metadata:
          type: object
          additionalProperties: { type: string }
          nullable: true

    AdminTemplate:
      type: object
      description: |
        Template as returned by the admin templates list. Unlike `Template`
        (the team-facing snapshot shape), this includes the owning `team_id`
        and omits `platform`/`metadata`.
      properties:
        name:
          type: string
        type:
          type: string
          enum: [base, snapshot]
        vcpus:
          type: integer
        memory_mb:
          type: integer
        size_bytes:
          type: integer
          format: int64
        team_id:
          type: string
          description: Owning team ID (formatted, e.g. `team-…`). Platform team for global templates.
        created_at:
          type: string
          format: date-time
        protected:
          type: boolean
          description: |
            True for built-in system base templates (minimal-ubuntu,
            minimal-alpine, minimal-arch, minimal-fedora). Protected templates
            cannot be deleted.

    ExecRequest:
      type: object
      required: [cmd]
      properties:
        cmd:
          type: string
        args:
          type: array
          items:
            type: string
        timeout_sec:
          type: integer
          default: 30
          description: Timeout in seconds (foreground exec only, default 30)
        background:
          type: boolean
          default: false
          description: If true, starts the process in the background and returns immediately with a PID and tag (HTTP 202)
        tag:
          type: string
          description: Optional user-chosen tag for the background process. Auto-generated if omitted. Only used when background is true.
        envs:
          type: object
          additionalProperties:
            type: string
          description: Environment variables for the process (applies to both foreground and background exec)
        cwd:
          type: string
          description: Working directory for the process (applies to both foreground and background exec)

    BackgroundExecResponse:
      type: object
      properties:
        sandbox_id:
          type: string
        cmd:
          type: string
        pid:
          type: integer
        tag:
          type: string

    ProcessEntry:
      type: object
      properties:
        pid:
          type: integer
        tag:
          type: string
        cmd:
          type: string
        args:
          type: array
          items:
            type: string

    ProcessListResponse:
      type: object
      properties:
        processes:
          type: array
          items:
            $ref: "#/components/schemas/ProcessEntry"

    ExecResponse:
      type: object
      properties:
        sandbox_id:
          type: string
        cmd:
          type: string
        stdout:
          type: string
        stderr:
          type: string
        exit_code:
          type: integer
        duration_ms:
          type: integer
        encoding:
          type: string
          enum: [utf-8, base64]
          description: Output encoding. "base64" when stdout/stderr contain binary data.

    ReadFileRequest:
      type: object
      required: [path]
      properties:
        path:
          type: string
          description: Absolute file path inside the capsule

    ListDirRequest:
      type: object
      required: [path]
      properties:
        path:
          type: string
          description: Directory path inside the capsule
        depth:
          type: integer
          default: 1
          description: Recursion depth (0 = non-recursive, 1 = immediate children)

    ListDirResponse:
      type: object
      properties:
        entries:
          type: array
          items:
            $ref: "#/components/schemas/FileEntry"

    FileEntry:
      type: object
      properties:
        name:
          type: string
        path:
          type: string
        type:
          type: string
          enum: [file, directory, symlink]
        size:
          type: integer
          format: int64
        mode:
          type: integer
        permissions:
          type: string
          description: Human-readable permissions (e.g. "-rwxr-xr-x")
        owner:
          type: string
        group:
          type: string
        modified_at:
          type: integer
          format: int64
          description: Unix timestamp (seconds)
        symlink_target:
          type: string
          nullable: true

    MakeDirRequest:
      type: object
      required: [path]
      properties:
        path:
          type: string
          description: Directory path to create inside the capsule

    MakeDirResponse:
      type: object
      properties:
        entry:
          $ref: "#/components/schemas/FileEntry"

    RemoveRequest:
      type: object
      required: [path]
      properties:
        path:
          type: string
          description: Path to remove inside the capsule

    CreateHostRequest:
      type: object
      required: [type]
      properties:
        type:
          type: string
          enum: [regular, byoc]
          description: Host type. Regular hosts are shared; BYOC hosts belong to a team.
        team_id:
          type: string
          description: Required for BYOC hosts.
        provider:
          type: string
          description: Cloud provider (e.g. aws, gcp, hetzner, bare-metal).
        availability_zone:
          type: string
          description: Availability zone (e.g. us-east, eu-west).

    CreateHostResponse:
      type: object
      properties:
        host:
          $ref: "#/components/schemas/Host"
        registration_token:
          type: string
          description: One-time registration token for the host agent. Expires in 1 hour.

    RegisterHostRequest:
      type: object
      required: [token, address]
      properties:
        token:
          type: string
          description: One-time registration token from POST /v1/hosts.
        arch:
          type: string
          description: CPU architecture (e.g. x86_64, aarch64).
        cpu_cores:
          type: integer
        memory_mb:
          type: integer
        disk_gb:
          type: integer
        address:
          type: string
          description: Host agent address (ip:port).

    RegisterHostResponse:
      type: object
      properties:
        host:
          $ref: "#/components/schemas/Host"
        token:
          type: string
          description: Host JWT for X-Host-Token header. Valid for 7 days.
        refresh_token:
          type: string
          description: Refresh token for obtaining new JWTs. Valid for 60 days; rotated on each use.
        cert_pem:
          type: string
          description: mTLS client certificate (PEM). Only returned when the host enrolls into mTLS.
        key_pem:
          type: string
          description: mTLS client private key (PEM). Only returned when the host enrolls into mTLS.
        ca_cert_pem:
          type: string
          description: CA certificate (PEM) to verify the control plane. Only returned when the host enrolls into mTLS.

    Host:
      type: object
      properties:
        id:
          type: string
        type:
          type: string
          enum: [regular, byoc]
        team_id:
          type: string
          nullable: true
        provider:
          type: string
          nullable: true
        availability_zone:
          type: string
          nullable: true
        arch:
          type: string
          nullable: true
        cpu_cores:
          type: integer
          nullable: true
        memory_mb:
          type: integer
          nullable: true
        disk_gb:
          type: integer
          nullable: true
        address:
          type: string
          nullable: true
        status:
          type: string
          enum: [pending, online, offline, draining, unreachable]
        last_heartbeat_at:
          type: string
          format: date-time
          nullable: true
        created_by:
          type: string
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
        team_name:
          type: string
          nullable: true
          description: Team name (included when listing hosts as an admin).
        running_vcpus:
          type: integer
          description: Total vCPUs allocated to running capsules on this host.
        running_memory_mb:
          type: integer
          description: Total memory in MB allocated to running capsules on this host.
        running_disk_mb:
          type: integer
          description: Total disk in MB allocated to running capsules on this host.
        paused_memory_mb:
          type: integer
          description: Total memory in MB allocated to paused capsules on this host.
        paused_disk_mb:
          type: integer
          description: Total disk in MB allocated to paused capsules on this host.

    RefreshHostTokenRequest:
      type: object
      required: [refresh_token]
      properties:
        refresh_token:
          type: string
          description: Refresh token obtained from registration or a previous refresh.

    RefreshHostTokenResponse:
      type: object
      properties:
        host:
          $ref: "#/components/schemas/Host"
        token:
          type: string
          description: New host JWT. Valid for 7 days.
        refresh_token:
          type: string
          description: New refresh token. Valid for 60 days; old token is revoked.
        cert_pem:
          type: string
          description: mTLS client certificate (PEM). Only returned when the host enrolls into mTLS.
        key_pem:
          type: string
          description: mTLS client private key (PEM). Only returned when the host enrolls into mTLS.
        ca_cert_pem:
          type: string
          description: CA certificate (PEM) to verify the control plane. Only returned when the host enrolls into mTLS.

    HostDeletePreview:
      type: object
      properties:
        host:
          $ref: "#/components/schemas/Host"
        sandbox_ids:
          type: array
          items:
            type: string
          description: IDs of capsules that would be destroyed on force-delete.

    HostHasCapsulesError:
      allOf:
        - $ref: "#/components/schemas/Error"
      description: |
        Standard error envelope returned by host delete (409) when the host
        still has active capsules. `error.code` is `has_active_sandboxes` and
        `error.details.sandbox_ids` lists the IDs of the capsules blocking
        deletion — pass `?force=true` to destroy them and delete the host.

    AddTagRequest:
      type: object
      required: [tag]
      properties:
        tag:
          type: string

    UserSearchResult:
      type: object
      properties:
        user_id:
          type: string
        email:
          type: string

    Team:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        slug:
          type: string
          description: |
            URL slug (auto-generated, e.g. a1b2c3-d1e2f3). Changeable once every
            60 days; used to reference the team's public templates as
            `<slug>/<name>`.
        is_byoc:
          type: boolean
          description: Whether the team runs on its own bring-your-own-cloud hosts
        created_at:
          type: string
          format: date-time
        slug_change_allowed_at:
          type: string
          format: date-time
          description: |
            Present only while the team is within the 60-day slug-change
            cooldown; the earliest time the slug may be changed again. Absent
            means a change is allowed now.

    TeamWithRole:
      allOf:
        - $ref: "#/components/schemas/Team"
        - type: object
          properties:
            role:
              type: string
              enum: [owner, admin, member]

    TeamMember:
      type: object
      properties:
        user_id:
          type: string
        name:
          type: string
        email:
          type: string
        role:
          type: string
          enum: [owner, admin, member]
        joined_at:
          type: string
          format: date-time

    TeamDetail:
      type: object
      properties:
        team:
          $ref: "#/components/schemas/Team"
        members:
          type: array
          items:
            $ref: "#/components/schemas/TeamMember"

    AdminTeam:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        slug:
          type: string
        is_byoc:
          type: boolean
        created_at:
          type: string
          format: date-time
        deleted_at:
          type: string
          format: date-time
          nullable: true
        member_count:
          type: integer
        owner_name:
          type: string
        owner_email:
          type: string
        active_sandbox_count:
          type: integer
        channel_count:
          type: integer
        running_vcpus:
          type: integer
        running_memory_mb:
          type: integer

    CapsuleMetrics:
      type: object
      properties:
        sandbox_id:
          type: string
        range:
          type: string
          enum: ["5m", "10m", "1h", "2h", "6h", "12h", "24h"]
        points:
          type: array
          items:
            $ref: "#/components/schemas/MetricPoint"

    MetricPoint:
      type: object
      properties:
        timestamp_unix:
          type: integer
          format: int64
        cpu_pct:
          type: number
          format: double
          description: "CPU utilization percentage (0-100), normalized to vCPU count"
        mem_bytes:
          type: integer
          format: int64
          description: "Resident memory in bytes (VmRSS of Cloud Hypervisor process)"
        disk_bytes:
          type: integer
          format: int64
          description: "Allocated disk bytes for the CoW sparse file"

    CreateChannelRequest:
      type: object
      required: [name, provider, config, events]
      properties:
        name:
          type: string
          description: Unique channel name within the team.
        provider:
          type: string
          enum: [discord, slack, teams, googlechat, telegram, matrix, webhook]
        config:
          type: object
          additionalProperties:
            type: string
          description: >
            Provider-specific configuration fields.
            Discord/Slack/Teams/Google Chat: {"webhook_url": "..."}.
            Telegram: {"bot_token": "...", "chat_id": "..."}.
            Matrix: {"homeserver_url": "...", "access_token": "...", "room_id": "..."}.
            Webhook: {"url": "...", "secret": "..."} (secret is auto-generated if omitted).
        events:
          type: array
          items:
            type: string
            enum:
              - capsule.create
              - capsule.pause
              - capsule.resume
              - capsule.destroy
              - template.snapshot.create
              - template.snapshot.delete
              - host.up
              - host.down

    TestChannelRequest:
      type: object
      required: [provider, config]
      properties:
        provider:
          type: string
          enum: [discord, slack, teams, googlechat, telegram, matrix, webhook]
        config:
          type: object
          additionalProperties:
            type: string
          description: Provider-specific configuration fields (same as CreateChannelRequest.config).

    RotateConfigRequest:
      type: object
      required: [config]
      properties:
        config:
          type: object
          additionalProperties:
            type: string
          description: >
            New provider configuration fields. Must include all required fields
            for the channel's provider. Replaces the existing config entirely.

    UpdateChannelRequest:
      type: object
      required: [name, events]
      properties:
        name:
          type: string
        events:
          type: array
          items:
            type: string
            enum:
              - capsule.create
              - capsule.pause
              - capsule.resume
              - capsule.destroy
              - template.snapshot.create
              - template.snapshot.delete
              - host.up
              - host.down

    ChannelResponse:
      type: object
      properties:
        id:
          type: string
        team_id:
          type: string
        name:
          type: string
        provider:
          type: string
          enum: [discord, slack, teams, googlechat, telegram, matrix, webhook]
        events:
          type: array
          items:
            type: string
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
        secret:
          type: string
          nullable: true
          description: Webhook secret. Only returned on creation, never again.

    MeResponse:
      type: object
      properties:
        user_id:
          type: string
        team_id:
          type: string
          description: The user's currently active team
        name:
          type: string
        email:
          type: string
          format: email
        role:
          type: string
          description: The user's role within the active team
        is_admin:
          type: boolean
          description: Whether the user is a platform administrator
        has_password:
          type: boolean
          description: Whether the user has a password set (false for OAuth-only accounts)
        providers:
          type: array
          items:
            type: string
          description: List of linked OAuth provider names (e.g. ["github"])

    ChangePasswordRequest:
      type: object
      required: [new_password]
      properties:
        current_password:
          type: string
          description: Required when changing an existing password
        new_password:
          type: string
          minLength: 8
        confirm_password:
          type: string
          description: Required when adding a password to an OAuth-only account (must match new_password)

    Error:
      type: object
      description: |
        Standard error envelope returned by every non-2xx JSON response.
        `code` is a stable machine-readable identifier (snake_case, e.g.
        `sandbox_not_running`, `capacity_unavailable`, `internal_error`).
        `message` is human-readable and safe to display. `request_id` matches
        the `X-Request-ID` response header and the server logs — quote it when
        reporting issues. `retryable` indicates the same request may succeed
        if retried. `details` carries optional machine-readable context
        (e.g. `{"status": "paused"}` on `sandbox_not_running`, or
        `{"field": "path"}` on `validation_failed`).
      properties:
        error:
          type: object
          required: [code, message, retryable]
          properties:
            code:
              type: string
              example: sandbox_not_running
            message:
              type: string
              example: Sandbox is not running.
            request_id:
              type: string
              example: req_8f3ka92b1c04d7e6
            retryable:
              type: boolean
              example: false
            details:
              type: object
              additionalProperties: true
              example: { status: paused }

    AuditLogEntry:
      type: object
      properties:
        id: { type: string }
        actor_type: { type: string, enum: [user, api_key, host, system] }
        actor_id: { type: string }
        actor_name: { type: string }
        resource_type: { type: string }
        resource_id: { type: string }
        action: { type: string }
        scope: { type: string }
        status: { type: string, enum: [success, failure] }
        metadata:
          type: object
          additionalProperties: true
        created_at:
          type: string
          format: date-time

    SSEEvent:
      type: object
      description: |
        Wire format of one SSE message body. The event name (`event:` line) is
        the `kind` and the JSON below is the `data:` line.
      properties:
        event:
          type: string
          enum:
            - connected
            - capsule.create
            - capsule.pause
            - capsule.resume
            - capsule.destroy
            - capsule.state.changed
            - template.snapshot.create
            - template.snapshot.delete
            - host.up
            - host.down
        outcome:
          type: string
          enum: [success, error]
          description: |
            Present for action events (capsule.* except state.changed,
            template.snapshot.*). Absent for host.up/down, capsule.state.changed,
            and the connected sentinel.
        resource:
          type: object
          properties:
            id: { type: string }
            type: { type: string }
        actor:
          type: object
          properties:
            type: { type: string, enum: [user, api_key, system] }
            id: { type: string }
            name: { type: string }
        metadata:
          type: object
          additionalProperties: { type: string }
          description: |
            Event-specific context. Examples: `reason` (ttl_expired,
            host_failure, cleanup_after_create_error, orphaned),
            `host_ip`, `from`/`to` (for capsule.state.changed).
        error:
          type: string
          description: Failure reason; only set when outcome=error.
        sandbox:
          allOf:
            - $ref: "#/components/schemas/Capsule"
          nullable: true
          description: Populated for capsule.* events; null if DB lookup failed.
        timestamp:
          type: string
          format: date-time
