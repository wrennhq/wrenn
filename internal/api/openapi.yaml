          schema:
            type: string
            enum: [SIGKILL, SIGTERM]
            default: SIGKILL
      responses:
        "204":
          description: Process killed
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          description: Capsule or process not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "409":
          description: Capsule not running
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"

  /v1/capsules/{id}/processes/{selector}/stream:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
      - name: selector
        in: path
        required: true
        description: Process PID (numeric) or tag (string)
        schema:
          type: string

    get:
      summary: Stream process output via WebSocket
      operationId: connectProcess
      tags: [capsules]
      security:
        - apiKeyAuth: []
        - sessionAuth: []
      description: |
        Opens a WebSocket connection to stream stdout/stderr from a running
        background process. The selector can be a numeric PID or a string tag.

        Server sends JSON messages:
        - `{"type": "start", "pid": 42}` — connected to process
        - `{"type": "stdout", "data": "..."}` — stdout output
        - `{"type": "stderr", "data": "..."}` — stderr output
        - `{"type": "exit", "exit_code": 0}` — process exited
        - `{"type": "error", "data": "..."}` — error message
      responses:
        "101":
          description: WebSocket upgrade

  /v1/capsules/{id}/ping:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string

    post:
      summary: Reset capsule inactivity timer
      operationId: pingCapsule
      tags: [capsules]
      security:
        - apiKeyAuth: []
        - sessionAuth: []
      description: |
        Resets the last_active_at timestamp for a running capsule, preventing
        the auto-pause TTL from expiring. Use this as a keepalive for capsules
        that are idle but should remain running.
      responses:
        "204":
          description: Ping acknowledged, inactivity timer reset
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          description: Capsule not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "409":
          description: Capsule not running
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /v1/capsules/{id}/metrics:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string

    get:
      summary: Get per-capsule resource metrics
      operationId: getCapsuleMetrics
      tags: [capsules]
      security:
        - apiKeyAuth: []
        - sessionAuth: []
      description: |
        Returns time-series CPU, memory, and disk metrics for a capsule.
        Three tiers are available with different granularity and retention:
        - `10m`: 500ms samples, last 10 minutes
        - `2h`: 30-second averages, last 2 hours
        - `24h`: 5-minute averages, last 24 hours

        For running capsules, data comes from the host agent's in-memory
        ring buffer. For paused capsules, data is read from persisted
        snapshots in the database. Stopped/destroyed capsules return 404.
      parameters:
        - name: range
          in: query
          required: false
          schema:
            type: string
            enum: ["5m", "10m", "1h", "2h", "6h", "12h", "24h"]
            default: "10m"
          description: Time range filter to query
      responses:
        "200":
          description: Metrics retrieved
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CapsuleMetrics"
        "400":
          description: Invalid range parameter
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: Capsule not found or metrics not available
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"

  /v1/capsules/{id}/pause:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string

    post:
      summary: Pause a running capsule
      operationId: pauseCapsule
      tags: [capsules]
      security:
        - apiKeyAuth: []
        - sessionAuth: []
      description: |
        Takes a snapshot of the capsule (VM state + memory + rootfs), then
        destroys all running resources. The capsule exists only as files on
        disk and can be resumed later.
      responses:
        "202":
          description: Capsule pause initiated (status will be "pausing")
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Capsule"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: Capsule not running
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"

  /v1/capsules/{id}/resume:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string

    post:
      summary: Resume a paused capsule
      operationId: resumeCapsule
      tags: [capsules]
      security:
        - apiKeyAuth: []
        - sessionAuth: []
      description: |
        Restores a paused capsule from its snapshot. Cloud Hypervisor is
        relaunched in --restore mode with memory_restore_mode=ondemand so
        guest pages fault in lazily via userfaultfd. The original network
        slot (and host-reachable IP) is preserved across pause/resume.
      responses:
        "202":
          description: Capsule resume initiated (status will be "resuming")
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Capsule"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: Capsule not paused
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"

  /v1/volumes:
    post:
      summary: Create a storage volume
      operationId: createVolume
      tags: [volumes]
      security:
        - apiKeyAuth: []
        - sessionAuth: []
      description: |
        Create an external storage volume. The volume starts detached and is
        not placed on any host until it is first attached to a capsule (via
        `volume_ids` on capsule create), at which point it is pinned to that
        capsule's host for the rest of its life. Destroying a capsule only frees
        its volumes, never deletes them; the one case where a volume is removed
        without an explicit delete is deleting the team that owns it.

        Every volume has a `vl-`-prefixed name that is unique within your team
        and can be used anywhere a volume ID is accepted. Omit `name` and the
        volume is named after its own ID.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateVolumeRequest"
      responses:
        "201":
          description: Volume created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Volume"
        "400":
          $ref: "#/components/responses/BadRequest"
        "409":
          description: A volume with this name already exists
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
    get:
      summary: List storage volumes
      operationId: listVolumes
      tags: [volumes]
      security:
        - apiKeyAuth: []
        - sessionAuth: []
      responses:
        "200":
          description: List of volumes
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Volume"

  /v1/volumes/{id}:
    get:
      summary: Get a storage volume
      operationId: getVolume
      tags: [volumes]
      security:
        - apiKeyAuth: []
        - sessionAuth: []
      description: |
        Look up a volume by ID (`vol-...`) or by name (`vl-cache`, or plain
        `cache` — the `vl-` prefix is optional on input).
      parameters:
        - $ref: "#/components/parameters/VolumeRef"
      responses:
        "200":
          description: The volume
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Volume"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
    delete:
      summary: Delete a storage volume
      operationId: deleteVolume
      tags: [volumes]
      security:
        - apiKeyAuth: []
        - sessionAuth: []
      description: |
        Delete a volume and its data. The volume must be detached — destroy any
        capsule using it first. Accepts an ID or a name.
      parameters:
        - $ref: "#/components/parameters/VolumeRef"
      responses:
        "204":
          description: Volume deleted
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: Volume is attached to a capsule
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /v1/snapshots:
    post:
      summary: Create a snapshot template
      operationId: createSnapshot
      tags: [snapshots]
      security:
        - apiKeyAuth: []
        - sessionAuth: []
      description: |
        Snapshot a capsule, processed asynchronously. The call returns
        immediately with the capsule in the `snapshotting` state, then it
        returns to its original state on completion. The capsule must be
        `running` or `paused`.

        A `running` capsule is snapshotted live: it briefly pauses while its VM
        state + memory + flattened rootfs are written to a new template, then
        resumes to `running`. A `paused` capsule is snapshotted directly from
        its on-disk state without reviving the VM, and stays `paused`.

        Because it is async, the response does NOT contain the template. Watch
        for the `template.snapshot.create` SSE event (its `outcome` reports
        success or failure) or poll `GET /v1/snapshots` to observe completion.

        Snapshots are immutable: each call must use a fresh name. Re-using
        an existing name returns 409 Conflict.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateSnapshotRequest"
      responses:
        "202":
          description: Snapshot accepted; capsule is now snapshotting
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Capsule"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: Name already exists, or capsule is not running or paused
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

    get:
      summary: List templates your team can launch
      operationId: listSnapshots
      tags: [snapshots]
      security:
        - apiKeyAuth: []
        - sessionAuth: []
      description: |
        Returns one page of the templates your team may launch: your own
        templates, platform templates, and every public template across all
        teams. Public templates owned by another team carry that team's `slug`
        and are referenced as `<slug>/<name>` when creating a capsule.
      parameters:
        - name: type
          in: query
          required: false
          schema:
            type: string
            enum: [base, snapshot]
          description: Filter by template type.
        - name: q
          in: query
          required: false
          schema:
            type: string
          description: Search over template name and owning team slug.
        - name: page
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            default: 1
          description: 1-based page number.
        - name: per_page
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 200
            default: 50
          description: Page size (max 200).
      responses:
        "200":
          description: Paginated list of visible templates
          content:
            application/json:
              schema:
                type: object
                properties:
                  templates:
                    type: array
                    items:
                      $ref: "#/components/schemas/Template"
                  total:
                    type: integer
                  page:
                    type: integer
                  per_page:
                    type: integer
                  total_pages:
                    type: integer

  /v1/snapshots/{name}/visibility:
    parameters:
      - name: name
        in: path
        required: true
        schema:
          type: string

    patch:
      summary: Publish or unpublish a template
      operationId: setTemplateVisibility
      tags: [snapshots]
      security:
        - apiKeyAuth: []
        - sessionAuth: []
      description: |
        Publish or unpublish a template your team owns. A public template can be
        launched by any team as `<your-team-slug>/<name>`. Only the owning team
        may change visibility.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [public]
              properties:
                public:
                  type: boolean
                  description: True to publish, false to unpublish.
      responses:
        "204":
          description: Visibility updated
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          description: Your team does not own a template with that name
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /v1/snapshots/{name}:
    parameters:
      - name: name
        in: path
        required: true
        schema:
          type: string

    patch:
      summary: Rename a template
      operationId: renameTemplate
      tags: [snapshots]
      security:
        - apiKeyAuth: []
        - sessionAuth: []
      description: |
        Rename a template your team owns. Renaming unpublishes the template, so
        any `<your-team-slug>/<name>` references other teams held stop resolving
        and the owner must republish under the new name. Platform-owned and
        system base templates cannot be renamed here.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [new_name]
              properties:
                new_name:
                  type: string
                  description: New template name (letters, digits, dot, dash, underscore; max 64).
      responses:
        "204":
          description: Template renamed
        "400":
          $ref: "#/components/responses/BadRequest"
        "403":
          description: Cannot rename a platform-owned / system base template
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: Your team does not own a template with that name
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "409":
          description: A template with the new name already exists
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

    delete:
      summary: Delete a snapshot template
      operationId: deleteSnapshot
      tags: [snapshots]
      security:
        - apiKeyAuth: []
        - sessionAuth: []
      description: Removes the snapshot files from disk and deletes the database record.
      responses:
        "204":
          description: Snapshot deleted
        "400":
          $ref: "#/components/responses/BadRequest"
        "403":
          description: Cannot delete a platform-owned / system base template
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: Template not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "409":
          description: Delete failed (e.g. owning host offline)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

