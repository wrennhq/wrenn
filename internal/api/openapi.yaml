      - name: id
        in: path
        required: true
        schema: {type: string}
    post:
      summary: List directory contents on any capsule (admin)
      operationId: adminListDir
      tags: [admin]
      security:
        - sessionAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ListDirRequest"
      responses:
        "200":
          description: Directory listing
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ListDirResponse"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/FailedPrecondition"

  /v1/admin/capsules/{id}/files/mkdir:
    parameters:
      - name: id
        in: path
        required: true
        schema: {type: string}
    post:
      summary: Create a directory on any capsule (admin)
      operationId: adminMakeDir
      tags: [admin]
      security:
        - sessionAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MakeDirRequest"
      responses:
        "200":
          description: Directory created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MakeDirResponse"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/FailedPrecondition"

  /v1/admin/capsules/{id}/files/remove:
    parameters:
      - name: id
        in: path
        required: true
        schema: {type: string}
    post:
      summary: Remove a file or directory on any capsule (admin)
      operationId: adminRemovePath
      tags: [admin]
      security:
        - sessionAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RemoveRequest"
      responses:
        "204":
          description: File or directory removed
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/FailedPrecondition"

  /v1/admin/capsules/{id}/exec/stream:
    parameters:
      - name: id
        in: path
        required: true
        schema: {type: string}
    get:
      summary: Stream command execution on any capsule via WebSocket (admin)
      operationId: adminExecStream
      tags: [admin]
      security:
        - sessionAuth: []
      description: |
        Admin variant of /v1/capsules/{id}/exec/stream. Same protocol — WebSocket
        upgrade, client sends `{"type":"start", "cmd":..., "args":...}` to start;
        server streams stdout/stderr/exit frames.
      responses:
        "101":
          description: WebSocket upgrade
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/FailedPrecondition"

  /v1/admin/capsules/{id}/pty:
    parameters:
      - name: id
        in: path
        required: true
        schema: {type: string}
    get:
      summary: Interactive PTY session on any capsule via WebSocket (admin)
      operationId: adminPtySession
      tags: [admin]
      security:
        - sessionAuth: []
      description: |
        Admin variant of /v1/capsules/{id}/pty. Same protocol — base64-encoded
        PTY bytes, start/connect/input/resize/kill control messages, persistent
        sessions reconnectable via tag.
      responses:
        "101":
          description: WebSocket upgrade
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/FailedPrecondition"

  /v1/admin/capsules/{id}/processes/{selector}/stream:
    parameters:
      - name: id
        in: path
        required: true
        schema: {type: string}
      - name: selector
        in: path
        required: true
        schema: {type: string}
        description: Process PID (numeric) or tag (string)
    get:
      summary: Stream process output on any capsule via WebSocket (admin)
      operationId: adminConnectProcess
      tags: [admin]
      security:
        - sessionAuth: []
      responses:
        "101":
          description: WebSocket upgrade
        "404":
          $ref: "#/components/responses/NotFound"

components:
  responses:
    BadRequest:
      description: Invalid request parameters
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"

    Unauthorized:
      description: Missing or invalid auth
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"

    Forbidden:
      description: Authenticated but not permitted (e.g. non-admin on /v1/admin/*)
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"

    NotFound:
      description: Resource not found
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"

    FailedPrecondition:
      description: Resource state does not allow this operation (e.g. exec on a paused capsule)
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"

  securitySchemes:
    apiKeyAuth:
      type: apiKey
      in: header
      name: X-API-Key
      description: API key for capsule lifecycle operations. Create via POST /v1/api-keys.

    sessionAuth:
      type: apiKey
      in: cookie
      name: wrenn_sid
      description: |
        Opaque session cookie set by POST /v1/auth/login, /v1/auth/activate, or
        the OAuth callback. HttpOnly, Secure, SameSite=Strict. Idle window 6h,
        absolute lifetime 24h. State-changing requests also require an
        X-CSRF-Token header matching the wrenn_csrf cookie (double-submit).
    csrfHeader:
      type: apiKey
      in: header
      name: X-CSRF-Token
      description: |
        Double-submit CSRF token whose value must match the wrenn_csrf cookie.
        Required on all non-GET requests authenticated via session cookie.
        Not required for API key auth.

    hostTokenAuth:
      type: apiKey
      in: header
      name: X-Host-Token
      description: Host JWT returned from POST /v1/hosts/register or POST /v1/hosts/auth/refresh. Valid for 7 days.

  schemas:
    SignupRequest:
      type: object
      required: [email, password, name]
      properties:
        email:
          type: string
          format: email
        password:
          type: string
          minLength: 8
        name:
          type: string
          maxLength: 100

    LoginRequest:
      type: object
      required: [email, password]
      properties:
        email:
          type: string
          format: email
        password:
          type: string

    SignupResponse:
      type: object
      properties:
        message:
          type: string
          description: Confirmation message instructing user to check email

    SessionResponse:
      type: object
      description: |
        Returned by login, activate, and switch-team. The actual auth credential
        is the wrenn_sid cookie set on the response. The body carries identity
        data the SPA needs to bootstrap.
      properties:
        user_id:
          type: string
        team_id:
          type: string
        email:
          type: string
        name:
          type: string
        role:
          type: string
        is_admin:
          type: boolean

    CreateAPIKeyRequest:
      type: object
      properties:
        name:
          type: string
          default: Unnamed API Key

    APIKeyResponse:
      type: object
      properties:
        id:
          type: string
        team_id:
          type: string
        name:
          type: string
        key_prefix:
          type: string
          description: Display prefix (e.g. "wrn_ab12cd34...")
        created_at:
          type: string
          format: date-time
        last_used:
          type: string
          format: date-time
          nullable: true
        key:
          type: string
          description: Full plaintext key. Only returned on creation, never again.
          nullable: true

    CreateCapsuleRequest:
      type: object
      properties:
        template:
          type: string
          default: minimal
        vcpus:
          type: integer
          default: 1
        memory_mb:
          type: integer
          default: 512
        disk_size_mb:
          type: integer
          default: 5120
          description: >
            Maximum size of the per-capsule copy-on-write disk in MB. Capped
            at 5 GB by default; the actual size is max(disk_size_mb, origin
            rootfs size).
        timeout_sec:
          type: integer
          minimum: 0
          default: 0
          description: >
            Auto-pause TTL in seconds. The capsule is automatically paused
            after this duration of inactivity (no exec or ping). 0 means
            no auto-pause. Positive values below 60 are silently clamped
            to 60 (the agent's startup envelope).

    UsageResponse:
      type: object
      properties:
        from:
          type: string
          format: date
        to:
          type: string
          format: date
        points:
          type: array
          items:
            type: object
            properties:
              date:
                type: string
                format: date
              cpu_minutes:
                type: number
              ram_mb_minutes:
                type: number

    CapsuleStats:
      type: object
      properties:
        range:
          type: string
          enum: [5m, 1h, 6h, 24h, 30d]
        current:
          type: object
          properties:
            running_count:
              type: integer
            vcpus_reserved:
              type: integer
            memory_mb_reserved:
              type: integer
            sampled_at:
              type: string
              format: date-time
              nullable: true
        peaks:
          type: object
          description: Maximum values over the last 30 days.
          properties:
            running_count:
              type: integer
            vcpus:
              type: integer
            memory_mb:
              type: integer
        series:
          type: object
          description: Parallel arrays for chart rendering.
          properties:
            labels:
              type: array
              items:
                type: string
                format: date-time
            running:
              type: array
              items:
                type: integer
            vcpus:
              type: array
              items:
                type: integer
            memory_mb:
              type: array
              items:
                type: integer

    Capsule:
      type: object
      properties:
        id:
          type: string
        status:
          type: string
          enum: [pending, starting, running, pausing, paused, resuming, stopping, hibernated, stopped, missing, error]
        template:
          type: string
        vcpus:
          type: integer
        memory_mb:
          type: integer
        timeout_sec:
          type: integer
        guest_ip:
          type: string
        host_ip:
          type: string
        created_at:
          type: string
          format: date-time
        started_at:
          type: string
          format: date-time
          nullable: true
        last_active_at:
          type: string
          format: date-time
          nullable: true
        last_updated:
          type: string
          format: date-time
        metadata:
          type: object
          additionalProperties: {type: string}
          nullable: true
          description: |
            Free-form key/value labels attached at create-time. Also carries
            agent-side version info (kernel_version, vmm_version,
            agent_version, envd_version) when running.
        disk_size_mb:
          type: integer
          nullable: true

    CreateSnapshotRequest:
      type: object
      required: [sandbox_id]
      properties:
        sandbox_id:
          type: string
          description: ID of the running capsule to snapshot.
        name:
          type: string
          description: Name for the snapshot template. Auto-generated if omitted.

    Template:
      type: object
      properties:
        name:
          type: string
        type:
          type: string
          enum: [base, snapshot]
        vcpus:
          type: integer
          nullable: true
        memory_mb:
          type: integer
          nullable: true
        size_bytes:
          type: integer
          format: int64
        created_at:
          type: string
          format: date-time
        platform:
          type: boolean
          description: |
            True when the template is platform-managed (visible to all teams,
            e.g. the built-in `minimal` rootfs). False for team-owned
            snapshot templates.
        metadata:
          type: object
          additionalProperties: {type: string}
          nullable: true

    ExecRequest:
      type: object
      required: [cmd]
      properties:
        cmd:
          type: string
        args:
          type: array
          items:
            type: string
        timeout_sec:
          type: integer
          default: 30
          description: Timeout in seconds (foreground exec only, default 30)
        background:
          type: boolean
          default: false
          description: If true, starts the process in the background and returns immediately with a PID and tag (HTTP 202)
        tag:
          type: string
          description: Optional user-chosen tag for the background process. Auto-generated if omitted. Only used when background is true.
        envs:
          type: object
          additionalProperties:
            type: string
          description: Environment variables for the process (background exec only)
        cwd:
          type: string
          description: Working directory for the process (background exec only)

    BackgroundExecResponse:
      type: object
      properties:
        sandbox_id:
          type: string
        cmd:
          type: string
        pid:
          type: integer
        tag:
          type: string

    ProcessEntry:
      type: object
      properties:
        pid:
          type: integer
        tag:
          type: string
        cmd:
          type: string
        args:
          type: array
          items:
            type: string

    ProcessListResponse:
      type: object
      properties:
        processes:
          type: array
          items:
            $ref: "#/components/schemas/ProcessEntry"

    ExecResponse:
      type: object
      properties:
        sandbox_id:
          type: string
        cmd:
          type: string
        stdout:
          type: string
        stderr:
          type: string
        exit_code:
          type: integer
        duration_ms:
          type: integer
        encoding:
          type: string
          enum: [utf-8, base64]
          description: Output encoding. "base64" when stdout/stderr contain binary data.

    ReadFileRequest:
      type: object
      required: [path]
      properties:
        path:
          type: string
          description: Absolute file path inside the capsule

    ListDirRequest:
      type: object
      required: [path]
      properties:
        path:
          type: string
          description: Directory path inside the capsule
        depth:
          type: integer
          default: 1
          description: Recursion depth (0 = non-recursive, 1 = immediate children)

    ListDirResponse:
      type: object
      properties:
        entries:
          type: array
          items:
            $ref: "#/components/schemas/FileEntry"

    FileEntry:
      type: object
      properties:
        name:
          type: string
        path:
          type: string
        type:
          type: string
          enum: [file, directory, symlink]
        size:
          type: integer
          format: int64
        mode:
          type: integer
        permissions:
          type: string
          description: Human-readable permissions (e.g. "-rwxr-xr-x")
        owner:
          type: string
        group:
          type: string
        modified_at:
          type: integer
          format: int64
          description: Unix timestamp (seconds)
        symlink_target:
          type: string
          nullable: true

    MakeDirRequest:
      type: object
      required: [path]
      properties:
        path:
          type: string
          description: Directory path to create inside the capsule

    MakeDirResponse:
      type: object
      properties:
        entry:
          $ref: "#/components/schemas/FileEntry"

    RemoveRequest:
      type: object
      required: [path]
      properties:
        path:
          type: string
          description: Path to remove inside the capsule

    CreateHostRequest:
      type: object
      required: [type]
      properties:
        type:
          type: string
          enum: [regular, byoc]
          description: Host type. Regular hosts are shared; BYOC hosts belong to a team.
        team_id:
          type: string
          description: Required for BYOC hosts.
        provider:
          type: string
          description: Cloud provider (e.g. aws, gcp, hetzner, bare-metal).
        availability_zone:
          type: string
          description: Availability zone (e.g. us-east, eu-west).

    CreateHostResponse:
      type: object
      properties:
        host:
          $ref: "#/components/schemas/Host"
        registration_token:
          type: string
          description: One-time registration token for the host agent. Expires in 1 hour.

    RegisterHostRequest:
      type: object
      required: [token, address]
      properties:
        token:
          type: string
          description: One-time registration token from POST /v1/hosts.
        arch:
          type: string
          description: CPU architecture (e.g. x86_64, aarch64).
        cpu_cores:
          type: integer
        memory_mb:
          type: integer
        disk_gb:
          type: integer
        address:
          type: string
          description: Host agent address (ip:port).

    RegisterHostResponse:
      type: object
      properties:
        host:
          $ref: "#/components/schemas/Host"
        token:
          type: string
          description: Host JWT for X-Host-Token header. Valid for 7 days.
        refresh_token:
          type: string
          description: Refresh token for obtaining new JWTs. Valid for 60 days; rotated on each use.

    Host:
      type: object
      properties:
        id:
          type: string
        type:
          type: string
          enum: [regular, byoc]
        team_id:
          type: string
          nullable: true
        provider:
          type: string
          nullable: true
        availability_zone:
          type: string
          nullable: true
        arch:
          type: string
          nullable: true
        cpu_cores:
          type: integer
          nullable: true
        memory_mb:
          type: integer
          nullable: true
        disk_gb:
          type: integer
          nullable: true
        address:
          type: string
          nullable: true
        status:
          type: string
          enum: [pending, online, offline, draining, unreachable]
        last_heartbeat_at:
          type: string
          format: date-time
          nullable: true
        created_by:
          type: string
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    RefreshHostTokenRequest:
      type: object
      required: [refresh_token]
      properties:
        refresh_token:
          type: string
          description: Refresh token obtained from registration or a previous refresh.

    RefreshHostTokenResponse:
      type: object
      properties:
        host:
          $ref: "#/components/schemas/Host"
        token:
          type: string
          description: New host JWT. Valid for 7 days.
        refresh_token:
          type: string
          description: New refresh token. Valid for 60 days; old token is revoked.

    HostDeletePreview:
      type: object
      properties:
        host:
          $ref: "#/components/schemas/Host"
        sandbox_ids:
          type: array
          items:
            type: string
          description: IDs of capsules that would be destroyed on force-delete.

    HostHasCapsulesError:
      type: object
      properties:
        error:
          type: object
          properties:
            code:
              type: string
              example: host_has_sandboxes
            message:
              type: string
            sandbox_ids:
              type: array
              items:
                type: string
              description: IDs of active capsules blocking deletion.

    AddTagRequest:
      type: object
      required: [tag]
      properties:
        tag:
          type: string

    UserSearchResult:
      type: object
      properties:
        user_id:
          type: string
        email:
          type: string

    Team:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        slug:
          type: string
          description: Immutable 12-char hex slug (e.g. a1b2c3-d1e2f3)
        created_at:
          type: string
          format: date-time

    TeamWithRole:
      allOf:
        - $ref: "#/components/schemas/Team"
        - type: object
          properties:
            role:
              type: string
              enum: [owner, admin, member]

    TeamMember:
      type: object
      properties:
        user_id:
          type: string
        email:
          type: string
        role:
          type: string
          enum: [owner, admin, member]
        joined_at:
          type: string
          format: date-time

    TeamDetail:
      type: object
      properties:
        team:
          $ref: "#/components/schemas/Team"
        members:
          type: array
          items:
            $ref: "#/components/schemas/TeamMember"

    CapsuleMetrics:
      type: object
      properties:
        sandbox_id:
          type: string
        range:
          type: string
          enum: ["5m", "10m", "1h", "2h", "6h", "12h", "24h"]
        points:
          type: array
          items:
            $ref: "#/components/schemas/MetricPoint"

    MetricPoint:
      type: object
      properties:
        timestamp_unix:
          type: integer
          format: int64
        cpu_pct:
          type: number
          format: double
          description: "CPU utilization percentage (0-100), normalized to vCPU count"
        mem_bytes:
          type: integer
          format: int64
          description: "Resident memory in bytes (VmRSS of Cloud Hypervisor process)"
        disk_bytes:
          type: integer
          format: int64
          description: "Allocated disk bytes for the CoW sparse file"

    CreateChannelRequest:
      type: object
      required: [name, provider, config, events]
      properties:
        name:
          type: string
          description: Unique channel name within the team.
        provider:
          type: string
          enum: [discord, slack, teams, googlechat, telegram, matrix, webhook]
        config:
          type: object
          additionalProperties:
            type: string
          description: >
            Provider-specific configuration fields.
            Discord/Slack/Teams/Google Chat: {"webhook_url": "..."}.
            Telegram: {"bot_token": "...", "chat_id": "..."}.
            Matrix: {"homeserver_url": "...", "access_token": "...", "room_id": "..."}.
            Webhook: {"url": "...", "secret": "..."} (secret is auto-generated if omitted).
        events:
          type: array
          items:
            type: string
            enum:
              - capsule.create
              - capsule.pause
              - capsule.resume
              - capsule.destroy
              - template.snapshot.create
              - template.snapshot.delete
              - host.up
              - host.down

    TestChannelRequest:
      type: object
      required: [provider, config]
      properties:
        provider:
          type: string
          enum: [discord, slack, teams, googlechat, telegram, matrix, webhook]
        config:
          type: object
          additionalProperties:
            type: string
          description: Provider-specific configuration fields (same as CreateChannelRequest.config).

    RotateConfigRequest:
      type: object
      required: [config]
      properties:
        config:
          type: object
          additionalProperties:
            type: string
          description: >
            New provider configuration fields. Must include all required fields
            for the channel's provider. Replaces the existing config entirely.

    UpdateChannelRequest:
      type: object
      required: [name, events]
      properties:
        name:
          type: string
        events:
          type: array
          items:
            type: string
            enum:
              - capsule.create
              - capsule.pause
              - capsule.resume
              - capsule.destroy
              - template.snapshot.create
              - template.snapshot.delete
              - host.up
              - host.down

    ChannelResponse:
      type: object
      properties:
        id:
          type: string
        team_id:
          type: string
        name:
          type: string
        provider:
          type: string
          enum: [discord, slack, teams, googlechat, telegram, matrix, webhook]
        events:
          type: array
          items:
            type: string
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
        secret:
          type: string
          nullable: true
          description: Webhook secret. Only returned on creation, never again.

    MeResponse:
      type: object
      properties:
        name:
          type: string
        email:
          type: string
          format: email
        has_password:
          type: boolean
          description: Whether the user has a password set (false for OAuth-only accounts)
        providers:
          type: array
          items:
            type: string
          description: List of linked OAuth provider names (e.g. ["github"])

    ChangePasswordRequest:
      type: object
      required: [new_password]
      properties:
        current_password:
          type: string
          description: Required when changing an existing password
        new_password:
          type: string
          minLength: 8
        confirm_password:
          type: string
          description: Required when adding a password to an OAuth-only account (must match new_password)

    Error:
      type: object
      properties:
        error:
          type: object
          properties:
            code:
              type: string
            message:
              type: string

    AuditLogEntry:
      type: object
      properties:
        id: {type: string}
        actor_type: {type: string, enum: [user, api_key, host, system]}
        actor_id: {type: string}
        actor_name: {type: string}
        resource_type: {type: string}
        resource_id: {type: string}
        action: {type: string}
        scope: {type: string}
        status: {type: string, enum: [success, failure]}
        metadata:
          type: object
          additionalProperties: true
        created_at:
          type: string
          format: date-time

    SSEEvent:
      type: object
      description: |
        Wire format of one SSE message body. The event name (`event:` line) is
        the `kind` and the JSON below is the `data:` line.
      properties:
        event:
          type: string
          enum:
            - connected
            - capsule.create
            - capsule.pause
            - capsule.resume
            - capsule.destroy
            - capsule.state.changed
            - template.snapshot.create
            - template.snapshot.delete
            - host.up
            - host.down
        outcome:
          type: string
          enum: [success, error]
          description: |
            Present for action events (capsule.* except state.changed,
            template.snapshot.*). Absent for host.up/down, capsule.state.changed,
            and the connected sentinel.
        resource:
          type: object
          properties:
            id: {type: string}
            type: {type: string}
        actor:
          type: object
          properties:
            type: {type: string, enum: [user, api_key, system]}
            id: {type: string}
            name: {type: string}
        metadata:
          type: object
          additionalProperties: {type: string}
          description: |
            Event-specific context. Examples: `reason` (ttl_expired,
            host_failure, cleanup_after_create_error, orphaned),
            `host_ip`, `from`/`to` (for capsule.state.changed).
        error:
          type: string
          description: Failure reason; only set when outcome=error.
        sandbox:
          allOf:
            - $ref: "#/components/schemas/Capsule"
          nullable: true
          description: Populated for capsule.* events; null if DB lookup failed.
        timestamp:
          type: string
          format: date-time
