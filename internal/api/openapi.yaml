  /v1/capsules/{id}/exec/stream:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string

    get:
      summary: Stream command execution via WebSocket
      operationId: execStream
      tags: [capsules]
      security:
        - apiKeyAuth: []
        - sessionAuth: []
      description: |
        Opens a WebSocket connection for streaming command execution.

        **Client sends** (first message to start the process):
        ```json
        {"type": "start", "cmd": "tail", "args": ["-f", "/var/log/syslog"]}
        ```

        **Client sends** (to stop the process):
        ```json
        {"type": "stop"}
        ```

        **Server sends** (process events as they arrive):
        ```json
        {"type": "start", "pid": 1234}
        {"type": "stdout", "data": "line of output\n"}
        {"type": "stderr", "data": "warning message\n"}
        {"type": "exit", "exit_code": 0}
        {"type": "error", "data": "description of error"}
        ```

        The connection closes automatically after the process exits.

        Note: capsule-not-found and not-running conditions encountered after the
        WebSocket upgrade are delivered as in-band `{"type": "error"}` frames
        rather than HTTP status codes.
      responses:
        "101":
          description: WebSocket upgrade
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          description: Capsule not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "409":
          description: Capsule not running
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /v1/capsules/{id}/pty:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string

    get:
      summary: Interactive PTY session via WebSocket
      operationId: ptySession
      tags: [capsules]
      security:
        - apiKeyAuth: []
        - sessionAuth: []
      description: |
        Opens a WebSocket connection for an interactive PTY (terminal) session.
        Supports creating new sessions, sending input, resizing, killing, and
        reconnecting to existing sessions.

        **Client sends** (first message — start a new PTY):
        ```json
        {
          "type": "start",
          "cmd": "/bin/bash",
          "args": [],
          "cols": 80,
          "rows": 24,
          "envs": {"TERM": "xterm-256color"},
          "cwd": "/home/user",
          "user": "user"
        }
        ```
        All fields except `type` are optional. Defaults: cmd="/bin/bash", cols=80, rows=24.

        **Client sends** (first message — reconnect to existing PTY):
        ```json
        {"type": "connect", "tag": "pty-abc123de"}
        ```

        **Client sends** (control messages, after session is established — JSON text frames):
        ```json
        {"type": "resize", "cols": 120, "rows": 40}
        {"type": "kill"}
        ```

        Keystroke input is sent as **raw binary WebSocket frames** containing the
        terminal bytes verbatim — not JSON, not base64. Every binary frame from
        the client is treated as PTY input.

        **Server sends** (control messages — JSON text frames):
        ```json
        {"type": "started", "tag": "pty-abc123de", "pid": 42}
        {"type": "exit", "exit_code": 0}
        {"type": "error", "data": "description", "fatal": true}
        {"type": "ping"}
        ```

        PTY output is sent as **raw binary WebSocket frames** containing the
        terminal bytes verbatim — not JSON, not base64. Sending input and output
        as binary avoids the ~33% inflation of base64 over the JSON path.

        The connection negotiates permessage-deflate (RFC 7692) compression
        automatically; rapid output (e.g. full-screen TUI repaints) is coalesced
        into fewer, larger frames before compression.

        Sessions persist across WebSocket disconnections — the process keeps
        running in the capsule. Use the `tag` from the "started" response to
        reconnect later.
      responses:
        "101":
          description: WebSocket upgrade
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          description: Capsule not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "409":
          description: Capsule not running
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /v1/capsules/{id}/files/stream/write:
    parameters:
      - name: id
        in: path
        required: true
