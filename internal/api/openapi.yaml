          description: Admin status updated
        "400":
          $ref: "#/components/responses/BadRequest"
        "403":
          description: Caller is not a platform admin
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: User not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /v1/events/stream:
    get:
      summary: Real-time lifecycle event stream
      operationId: streamEvents
      tags: [events]
      description: |
        Server-Sent Events stream of capsule, template, and host lifecycle
        events scoped to the caller's active team. Browsers send the
        wrenn_sid cookie automatically on EventSource connections; SDKs
        authenticate via X-API-Key.

        Frame format follows the standard SSE protocol:
        ```
        event: capsule.create
        data: {"event":"capsule.create","outcome":"success","resource":{"id":"sb-..."},"sandbox":{...},"timestamp":"2026-05-19T02:00:00Z"}

        : keepalive
        ```
        A `: keepalive` comment is emitted every 30s.
      security:
        - apiKeyAuth: []
        - sessionAuth: []
      responses:
        "200":
          description: SSE stream opened
          content:
            text/event-stream:
              schema:
                $ref: "#/components/schemas/SSEEvent"
        "401":
          description: Missing or invalid auth
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /v1/audit-logs:
    get:
      summary: List team audit log entries
      operationId: listAuditLogs
      tags: [audit]
      description: Paginated cursor list of audit events for the caller's team.
      security:
        - sessionAuth: []
      parameters:
        - name: before
          in: query
          required: false
          schema:
            type: string
            format: date-time
        - name: before_id
          in: query
          required: false
          schema:
            type: string
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 200
            default: 50
      responses:
        "200":
          description: Audit log page
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items:
                      $ref: "#/components/schemas/AuditLogEntry"
                  next_before:
                    type: string
                    format: date-time
                    description: Cursor for the next page (pass as `before`). Present only when the page is non-empty.
                  next_before_id:
                    type: string
                    description: Tiebreaker cursor for the next page (pass as `before_id`). Present only when the page is non-empty.

  /v1/admin/events/stream:
    get:
      summary: Admin SSE event stream (all teams)
      operationId: adminStreamEvents
      tags: [admin, events]
      description: |
        Admin variant of /v1/events/stream that emits events across all teams.
        Requires an admin session cookie.
      security:
        - sessionAuth: []
      responses:
        "200":
          description: SSE stream opened
          content:
            text/event-stream:
              schema:
                $ref: "#/components/schemas/SSEEvent"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"

  /v1/admin/audit-logs:
    get:
      summary: List audit log entries (all teams)
      operationId: adminListAuditLogs
      tags: [admin, audit]
      security:
        - sessionAuth: []
      parameters:
        - name: before
          in: query
          schema: { type: string, format: date-time }
        - name: before_id
          in: query
          schema: { type: string }
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 200, default: 50 }
      responses:
        "200":
          description: Audit log page (all teams)
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items:
                      $ref: "#/components/schemas/AuditLogEntry"
                  next_before:
                    type: string
                    format: date-time
                    description: Cursor for the next page (pass as `before`). Present only when the page is non-empty.
                  next_before_id:
                    type: string
                    description: Tiebreaker cursor for the next page (pass as `before_id`). Present only when the page is non-empty.

